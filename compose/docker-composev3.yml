services:
#========================================================================================
#                   postgres
#====================================================================================
 postgres-cloud:
  image: postgres:16-bookworm

  container_name: campuscloud-postgres
  restart: always

  environment:
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: ${POSTGRES_DB}

  ports:
   - "${POSTGRES_PORT}:5432"

  volumes: 
   - postgres_data:/var/lib/postgresql/data
  
  networks:
   - campus-network

#========================================================================================
#                  pgadmi
#====================================================================================


 pgadmin:
  image: dpage/pgadmin4:6.17


  container_name: campuscloud-pgadmi
  restart: always

  environment:
   PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
   PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
   

  ports:
   - "${PGADMIN_PORT}:80"

  volumes: 
   - pgadmin_data:/var/lib/pgadmin
  
  networks:
   - campus-network



#========================================================================================
#                 VOLUMES
#====================================================================================


volumes:

 postgres_data:
  external: true
  name: ${POSTGRES_VOLUME}

 pgadmin_data:
  external: true 
  name: ${PGADMIN_VOLUME}



#========================================================================================
#                 RED
#====================================================================================


networks:
 campus-network:
  external: true
  name: ${DOCKER_NETWORK}
  